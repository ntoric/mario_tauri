<!doctype html>
<html data-theme="light">
<head>
<link rel="stylesheet" href="/src/gooseroot/css/tokens.css">
<link rel="stylesheet" href="/src/gooseroot/css/gooseroot-ui.css">
<style>
  body { margin:0; font-family: var(--font-sans); background: var(--bg); display:grid; grid-template-columns:1fr 1fr; min-height:100vh; }
  .panel { background: var(--surface); margin:24px; border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); overflow:hidden; }
  .panel.small { display:flex; align-items:center; }
  .bar { padding:16px 24px; display:flex; gap:12px; align-items:center; background:var(--surface); position:fixed; top:0; left:0; right:0; z-index:9; }
  body { padding-top:64px; }
</style>
</head>
<body class="gr">
<div class="bar"><b style="flex:1">Empty state preview</b>
  <button class="gr-btn gr-btn--secondary" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">Toggle theme</button>
</div>
<div class="panel">
  <div class="gr-empty">
    <div class="gr-empty__art">
      <svg class="gr-empty__scene" viewBox="0 0 220 164" aria-hidden="true">
        <circle class="ges-orbit" cx="110" cy="80" r="70" />
        <circle class="ges-dot" cx="43" cy="61" r="3.4" />
        <circle class="ges-dot" cx="172" cy="47" r="3.4" />
        <circle class="ges-dot" cx="171" cy="115" r="3.4" />
        <circle class="ges-dot ges-dot--sm" cx="65" cy="134" r="2.4" />
        <path class="ges-star" d="M58 121 Q59.3 126.7 65 128 Q59.3 129.3 58 135 Q56.7 129.3 51 128 Q56.7 126.7 58 121 Z" />
        <path class="ges-star" d="M178 46 Q179 51 184 52 Q179 53 178 58 Q177 53 172 52 Q177 51 178 46 Z" />
        <path class="ges-star ges-star--sm" d="M136 133.5 Q136.8 137.2 140.5 138 Q136.8 138.8 136 142.5 Q135.2 138.8 131.5 138 Q135.2 137.2 136 133.5 Z" />
        <g transform="rotate(-7 79 82)">
          <rect class="ges-card" x="32" y="54" width="94" height="56" rx="15" />
          <rect class="ges-line" x="44" y="68" width="56" height="5" rx="2.5" />
          <rect class="ges-line" x="44" y="79" width="40" height="5" rx="2.5" />
          <rect class="ges-line" x="44" y="90" width="50" height="5" rx="2.5" />
        </g>
        <g transform="rotate(6 141 78)">
          <rect class="ges-card" x="94" y="50" width="94" height="56" rx="15" />
          <rect class="ges-line" x="106" y="64" width="54" height="5" rx="2.5" />
          <rect class="ges-line" x="106" y="75" width="38" height="5" rx="2.5" />
          <rect class="ges-line" x="106" y="86" width="48" height="5" rx="2.5" />
        </g>
      </svg>
      <span class="gr-empty__icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
    </div>
    <h3 class="gr-h3">No reviews yet</h3>
    <p class="gr-empty__text">Customers can review products once their order is delivered.</p>
  </div>
</div>
<div class="panel small">
  <div class="gr-empty gr-empty--compact" style="flex:1">
    <div class="gr-empty__art">
      <span class="gr-empty__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></span>
    </div>
    <p class="gr-empty__text">Click items to add</p>
  </div>
</div>
</body>
</html>
